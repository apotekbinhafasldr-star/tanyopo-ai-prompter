          grep -q '^ALL B4.2 LOCAL TESTS PASSED' "$RUNNER_TEMP/b42.txt"

  # AI jobs quota guard (supabase/migrations/20261021120000 + 20261021120100) on PostgreSQL 17 (production is 17.x), SYNTHETIC data.
  # Rebased on main: the three S1 migrations are in the tree, so the suite builds the REAL chain (variant s1), a pre-S1 chain
  # (part 2 must refuse), the repo order (guard before B1/B2/plan-tampering/P0-2), billing parity before/after, 80 parallel
  # calls, idempotency, rollback to the exact live B10 body and re-apply. No other PR checkout is needed. run-local.sh refuses
  # any non-local host and any production credential variable. (Job id kept from the earlier job that ran PR #48's suite.)
  ai-jobs-guard-pg17:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: linoe_ci
          POSTGRES_PASSWORD: linoe_ci_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U linoe_ci -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: linoe_ci
      PGPASSWORD: linoe_ci_password
    steps:
      - uses: actions/checkout@v4

      - name: Ensure psql client
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      - name: Require PostgreSQL 17
        run: |
          v=$(psql -d postgres -Atc "show server_version_num")
          echo "server_version_num=$v"
          [ $((v/10000)) = 17 ] || { echo "::error::expected PostgreSQL 17, got $v"; exit 1; }

      - name: AI jobs quota guard SQL suite (PostgreSQL 17)
        run: |
          set -o pipefail
          bash supabase/tests/ai-jobs-guard/run-local.sh 2>&1 | tee "$RUNNER_TEMP/ajg17.txt" || true
          grep -E '^(FAIL|SOME|REFUSED)|ERROR' "$RUNNER_TEMP/ajg17.txt" | head -20 | sed 's/^/::error::/' || true
          grep -q '^ALL PASSED' "$RUNNER_TEMP/ajg17.txt"
          for v in s1 pre_s1; do grep -q "^PASS: $v: " "$RUNNER_TEMP/ajg17.txt" || { echo "::error::variant $v did not run"; exit 1; }; done

  # AI-jobs quota-guard wrapper (supabase/tools/quota-guard-wrapper): checksum lock, generator unit tests, and the wrapper
  # executed against a SYNTHETIC PostgreSQL 17 with a synthetic ledger (happy path, every STOP path, failure injection with
  # full rollback, split-execution detection, read-only pre/postflight verdicts). Nothing here can reach Supabase.
  quota-guard-wrapper-pg17:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: linoe_ci
          POSTGRES_PASSWORD: linoe_ci_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U linoe_ci -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: linoe_ci
      PGPASSWORD: linoe_ci_password
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure psql client
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      - name: Manifest checksums match the migrations, rollbacks and read-only checks
        run: node supabase/tools/quota-guard-wrapper/generate.mjs verify

      - name: Manifest lock matches the tested commit (when that commit is reachable)
        run: |
          set -e
          c=$(node -e 'process.stdout.write(require("./supabase/tools/quota-guard-wrapper/manifest.json").lockedAtCommit)')
          if git cat-file -e "$c^{commit}" 2>/dev/null; then
            for f in supabase/migrations/20261021120000_prompter_ai_jobs_quota_guard.sql supabase/migrations/20261021120100_prompter_ai_jobs_delete_guard.sql; do
              a=$(git show "$c:$f" | sha256sum | cut -d' ' -f1); b=$(sha256sum "$f" | cut -d' ' -f1)
              [ "$a" = "$b" ] || { echo "::error::$f differs from lockedAtCommit $c"; exit 1; }
            done
            echo "guard files identical to lockedAtCommit $c"
          else
            echo "::warning::lockedAtCommit $c is not reachable (history rewritten or squashed); relying on manifest checksums only"
          fi

      - name: Generator unit tests
        run: node --test supabase/tests/ai-jobs-guard/wrapper.test.mjs

      - name: Quota-guard wrapper on synthetic PostgreSQL 17 (required)
        env:
          REQUIRE_PG_MAJOR: "17"
        run: |
          set -o pipefail
          bash supabase/tests/ai-jobs-guard/wrapper-local.sh 2>&1 | tee "$RUNNER_TEMP/qgw.txt" || true
          grep -E '^(FAIL|SOME|REFUSED)' "$RUNNER_TEMP/qgw.txt" | head -20 | sed 's/^/::error::/' || true
          grep -q '^ALL QUOTA-GUARD WRAPPER CHECKS PASSED' "$RUNNER_TEMP/qgw.txt"
          if grep -q '^FAIL' "$RUNNER_TEMP/qgw.txt"; then exit 1; fi

  # S1 migration wrapper (supabase/tools/s1-wrapper): generator unit tests + the wrapper executed against a SYNTHETIC
  # PostgreSQL 17 (ledger shape of production, fake versions). Nothing here can reach Supabase or any shared database.
  s1-wrapper-pg17:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: linoe_ci
          POSTGRES_PASSWORD: linoe_ci_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U linoe_ci -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: linoe_ci
      PGPASSWORD: linoe_ci_password
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure psql client
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      - name: Manifest checksums match the three S1 migration files
        run: node supabase/tools/s1-wrapper/generate.mjs verify

      - name: Manifest lock matches the tested commit (when that commit is reachable)
        run: |
          set -e
          c=$(node -e 'process.stdout.write(require("./supabase/tools/s1-wrapper/manifest.json").lockedAtCommit)')
          if git cat-file -e "$c^{commit}" 2>/dev/null; then
            for f in supabase/migrations/20261019100000_prompter_p0_ai_jobs_lockdown.sql supabase/migrations/20261019100100_prompter_p0_subscription_trial_insert_guard.sql supabase/migrations/20261019100200_prompter_p0_plan_entitlements_lockdown.sql; do
              a=$(git show "$c:$f" | sha256sum | cut -d' ' -f1); b=$(sha256sum "$f" | cut -d' ' -f1)
              [ "$a" = "$b" ] || { echo "::error::$f differs from lockedAtCommit $c"; exit 1; }
            done
            echo "S1 files identical to lockedAtCommit $c"
          else
            echo "::warning::lockedAtCommit $c is not reachable (history rewritten or squashed); relying on manifest checksums only"
          fi

      - name: Generator unit tests
        run: node --test supabase/tests/s1-wrapper/generator.test.mjs

      - name: S1 wrapper on synthetic PostgreSQL 17 (required)
        env:
          REQUIRE_PG_MAJOR: "17"
        run: |
          set -o pipefail
          bash supabase/tests/s1-wrapper/run-local.sh 2>&1 | tee "$RUNNER_TEMP/s1w.txt"
          grep -q '^ALL S1 WRAPPER CHECKS PASSED' "$RUNNER_TEMP/s1w.txt"
          if grep -q '^FAIL' "$RUNNER_TEMP/s1w.txt"; then exit 1; fi

  # Phase E.1: Founder approval storage (supabase/migrations/20261027130000_linoe_tax_optimization_approvals.sql) on a
  # THROW-AWAY PostgreSQL 17 with synthetic data. Applies the finance foundation + admin access migrations first, then runs
  # the behaviour suite, real parallel backends, rollback, and negative controls. Nothing here can reach Supabase.
  tax-approvals-pg17:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: linoe_ci
          POSTGRES_PASSWORD: linoe_ci_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U linoe_ci -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: linoe_ci
      PGPASSWORD: linoe_ci_password
    steps:
      - uses: actions/checkout@v4

      - name: Ensure psql client
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      - name: Tax optimization approvals on PostgreSQL 17 (required)
        env:
          REQUIRE_PG_MAJOR: "17"
        run: |
          set -o pipefail
          bash supabase/tests/tax-approvals/run-local.sh 2>&1 | tee "$RUNNER_TEMP/taxapp.txt"
          grep -q '^ALL TAX APPROVAL CHECKS PASSED' "$RUNNER_TEMP/taxapp.txt"
          if grep -q '^FAIL' "$RUNNER_TEMP/taxapp.txt"; then exit 1; fi

      - name: Finance chain (4 migrations in order, journal integrity, legacy isolation, reverse rollback) on PostgreSQL 17 (required)
        env:
          REQUIRE_PG_MAJOR: "17"
        run: |
          set -o pipefail
          bash supabase/tests/finance-chain/run-local.sh 2>&1 | tee "$RUNNER_TEMP/chain.txt"
          grep -q '^ALL FINANCE CHAIN CHECKS PASSED' "$RUNNER_TEMP/chain.txt"
          if grep -q '^FAIL' "$RUNNER_TEMP/chain.txt"; then exit 1; fi

  # Production-migration automation: unit tests of the runner/approval checker and a full REHEARSAL of the P0-2 package
  # (A -> B -> C -> D -> F, STOP paths, rollback, tamper cases, catalog diff) on a throw-away postgres:17 with synthetic data.
  # No secret, no Supabase connection: the rehearsal script refuses non-local hosts and any credential variable.
  prod-migration-rehearsal:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: linoe_ci
          POSTGRES_PASSWORD: linoe_ci_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U linoe_ci -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: linoe_ci
      PGPASSWORD: linoe_ci_password
    steps:
      - uses: actions/checkout@v4

      - name: Ensure psql client
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      - name: Production-migration rehearsal (PostgreSQL 17 required)
        env:
          REQUIRE_PG_MAJOR: "17"
        run: |
          set -o pipefail
          bash supabase/prod-packages/tests/rehearsal.sh 2>&1 | tee "$RUNNER_TEMP/pm.txt" || true
          grep -E '^(FAIL|SOME|REFUSED)|ERROR' "$RUNNER_TEMP/pm.txt" | head -20 | sed 's/^/::error::/' || true
          grep -q '^ALL PASSED' "$RUNNER_TEMP/pm.txt"
