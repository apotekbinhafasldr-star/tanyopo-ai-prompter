name: QA-2 schema bundle test (sandbox)

# Uji otomatis ATAS bundel skema QA-2 pada Postgres sementara (service container) dengan stand-in Supabase minimal
# (qa/ci/supabase-standin.sql). TANPA secret, tanpa jaringan keluar, tanpa proyek Supabase nyata.
# Bukti yang dihasilkan: SANDBOX (stand-in), bukan REAL.
on:
  pull_request:
    paths:
      - "qa/**"
      - "scripts/qa/build-schema-bundle.mjs"
      - "scripts/qa/apply-schema-bundle.mjs"
      - "scripts/qa/qa-acl-requirements.mjs"
      - "supabase/migrations/**"
      - ".github/workflows/qa2-schema-bundle-test.yml"

permissions:
  contents: read

concurrency:
  group: qa2-schema-bundle-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle-on-postgres:
    name: bundle 3 bagian (PostgreSQL ${{ matrix.pg }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        pg: ["16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Pastikan psql
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      - name: Bangun bundel 3 bagian
        run: node scripts/qa/build-schema-bundle.mjs --out "$RUNNER_TEMP/bundle/qa2.sql" --parts 3

      - name: Muat stand-in Supabase dan terapkan bagian 1,2,3 berurutan
        run: |
          set -euo pipefail
          psql -X -q -v ON_ERROR_STOP=1 -d postgres -f qa/ci/supabase-standin.sql
          for i in 1 2 3; do
            psql -X -q -At -v ON_ERROR_STOP=1 -d postgres -f "$RUNNER_TEMP/bundle/qa2.part${i}of3.sql" > "$RUNNER_TEMP/out$i.txt"
          done
          echo "Baris verifikasi akhir: $(tail -n 1 "$RUNNER_TEMP/out3.txt")"
          test "$(tail -n 1 "$RUNNER_TEMP/out3.txt")" = "15|O|1|1|3|t|t|t|1"

      - name: Uji RLS lintas tenant (harus ALL_PASS | fails=0)
        run: |
          set -uo pipefail
          out="$(psql -X -q -v ON_ERROR_STOP=1 -d postgres -f qa/qa2-rls-cross-tenant.sql 2>&1)" || true  # blok sengaja berakhir galat (exit 3)
          echo "$out" | grep -o 'QA2_RLS_RESULT.*' | cut -c1-300 || true
          echo "$out" | grep -q 'QA2_RLS_RESULT ALL_PASS | fails=0' || { echo "RLS bukan ALL_PASS"; exit 1; }

      - name: Jalankan ulang bagian 1 (harus DITOLAK, proyek tidak kosong)
        run: |
          set -uo pipefail
          out="$(psql -X -q -v ON_ERROR_STOP=1 -d postgres -f "$RUNNER_TEMP/bundle/qa2.part1of3.sql" 2>&1)" && { echo "bagian 1 ulang seharusnya ditolak"; exit 1; }
          echo "$out" | grep ABORT || true
          echo "$out" | grep -q 'ABORT: schema public tidak kosong' || { echo "alasan penolakan tidak sesuai"; exit 1; }

      - name: Bagian tidak berurutan ditolak (basis data kosong baru)
        run: |
          set -uo pipefail
          createdb ooo
          psql -X -q -v ON_ERROR_STOP=1 -d ooo -f qa/ci/supabase-standin.sql
          for i in 2 3; do
            out="$(psql -X -q -v ON_ERROR_STOP=1 -d ooo -f "$RUNNER_TEMP/bundle/qa2.part${i}of3.sql" 2>&1)" && { echo "bagian $i di basis data kosong seharusnya ditolak"; exit 1; }
            echo "$out" | grep -E 'ABORT|ERROR' | head -n 2 || true
            # Pada basis data kosong tabel pelacak belum ada: PostgreSQL menolak (relation does not exist) sebelum pesan ABORT; keduanya = ditolak.
            echo "$out" | grep -Eq 'ABORT: bagian sebelumnya belum diterapkan|relation "public._linoe_sandbox_applied" does not exist' || { echo "alasan penolakan tidak sesuai"; exit 1; }
          done
          # Bagian 1 terpasang lalu bagian 3 (melewati 2): harus ditolak dengan pesan ABORT guard urutan.
          psql -X -q -v ON_ERROR_STOP=1 -d ooo -f "$RUNNER_TEMP/bundle/qa2.part1of3.sql" > /dev/null
          out="$(psql -X -q -v ON_ERROR_STOP=1 -d ooo -f "$RUNNER_TEMP/bundle/qa2.part3of3.sql" 2>&1)" && { echo "bagian 3 melewati 2 seharusnya ditolak"; exit 1; }
          echo "$out" | grep -q 'ABORT: bagian sebelumnya belum diterapkan' || { echo "alasan penolakan tidak sesuai"; exit 1; }

  # Meniru proyek Supabase QA NYATA: stand-in TANPA default privileges (proyek baru tidak memberinya). Run #4 (15 Nov 2026) gagal
  # service_role_access=f dan app_table_grants=f di proyek QA nyata tetapi lolos di job di atas karena stand-in memasang default privileges.
  grants-on-strict-postgres:
    name: grants bagian ke-4 tanpa default privileges (PostgreSQL ${{ matrix.pg }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        pg: ["16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Pastikan psql
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      - name: Bangun bundel dan stand-in ketat (tanpa default privileges)
        run: |
          set -euo pipefail
          node scripts/qa/build-schema-bundle.mjs --out "$RUNNER_TEMP/bundle/qa2.sql" --parts 3
          grep -v -i '^alter default privileges' qa/ci/supabase-standin.sql > "$RUNNER_TEMP/standin-strict.sql"
          if grep -qiE '^[[:space:]]*alter default privileges' "$RUNNER_TEMP/standin-strict.sql"; then echo "stand-in ketat masih memuat default privileges"; exit 1; fi

      - name: Terapkan bagian 1-3; verifikasi HARUS meniru kegagalan nyata (service_role_access=f, app_table_grants=f)
        run: |
          set -euo pipefail
          psql -X -q -v ON_ERROR_STOP=1 -d postgres -f "$RUNNER_TEMP/standin-strict.sql"
          for i in 1 2 3; do
            psql -X -q -At -v ON_ERROR_STOP=1 -d postgres -f "$RUNNER_TEMP/bundle/qa2.part${i}of3.sql" > "$RUNNER_TEMP/out$i.txt"
          done
          echo "Verifikasi sebelum grants: $(tail -n 1 "$RUNNER_TEMP/out3.txt")"
          test "$(tail -n 1 "$RUNNER_TEMP/out3.txt")" = "15|O|1|1|3|t|f|f|1"

      - name: Guard grants menolak basis data yang bukan sandbox QA-2 terpasang
        run: |
          set -uo pipefail
          createdb empty
          out="$(psql -X -q -v ON_ERROR_STOP=1 -d empty -f qa/qa2-grants.sql 2>&1)" && { echo "grants di basis data kosong seharusnya ditolak"; exit 1; }
          echo "$out" | grep -Eq 'ABORT|does not exist' || { echo "alasan penolakan tidak sesuai"; exit 1; }

      - name: Terapkan grants; verifikasi HARUS 15|O|1|1|3|t|t|t|1
        run: |
          set -euo pipefail
          psql -X -q -v ON_ERROR_STOP=1 -d postgres -f qa/qa2-grants.sql
          v="$(psql -X -q -At -d postgres -c "select (select count(*) from public._linoe_sandbox_applied)")"
          test "$v" = "15"
          cp "$RUNNER_TEMP/bundle/qa2.part3of3.sql" "$RUNNER_TEMP/p3.sql"
          # Verifikasi akhir bundel dijalankan ulang secara BACA-SAJA (potong blok verifikasi dari bagian 3).
          awk '/^-- ---- verifikasi BACA-SAJA/{f=1} f' "$RUNNER_TEMP/p3.sql" | grep -v '^--' > "$RUNNER_TEMP/verify.sql"
          line="$(psql -X -q -At -v ON_ERROR_STOP=1 -d postgres -f "$RUNNER_TEMP/verify.sql" | tail -n 1)"
          echo "Verifikasi setelah grants: $line"
          test "$line" = "15|O|1|1|3|t|t|t|1"

      - name: Idempotensi (ACL identik setelah grants dijalankan ulang; pelacak tetap 15)
        run: |
          set -euo pipefail
          snap() { psql -X -q -At -d postgres -c "select c.relname || ':' || coalesce(c.relacl::text, '') from pg_class c where c.relnamespace = 'public'::regnamespace and c.relkind in ('r','S','v') order by 1" | md5sum; }
          a="$(snap)"
          psql -X -q -v ON_ERROR_STOP=1 -d postgres -f qa/qa2-grants.sql
          b="$(snap)"
          echo "ACL sebelum=$a sesudah=$b"
          test "$a" = "$b"
          test "$(psql -X -q -At -d postgres -c 'select count(*) from public._linoe_sandbox_applied')" = "15"

      - name: Least privilege (tanpa UPDATE/DELETE langganan untuk authenticated, tanpa grant ke anon, setiap privilege punya policy)
        run: |
          set -euo pipefail
          q() { psql -X -q -At -v ON_ERROR_STOP=1 -d postgres -c "$1"; }
          test "$(q "select has_table_privilege('authenticated','public.prompter_subscriptions','update') or has_table_privilege('authenticated','public.prompter_subscriptions','delete') or has_table_privilege('authenticated','public.prompter_subscriptions','truncate')")" = "f"
          test "$(q "select count(*) from information_schema.role_table_grants where table_schema = 'public' and grantee in ('anon', 'PUBLIC')")" = "0"
          test "$(q "select count(*) from information_schema.role_table_grants where table_schema = 'public' and grantee = 'authenticated' and is_grantable = 'YES'")" = "0"
          test "$(q "select count(*) from pg_default_acl")" = "0"
          bad="$(q "select g.table_name || ':' || g.privilege_type from information_schema.role_table_grants g where g.table_schema = 'public' and g.grantee = 'authenticated' and g.table_name like 'prompter%' and g.privilege_type in ('SELECT','INSERT','UPDATE','DELETE') and not exists (select 1 from pg_policies p where p.schemaname = 'public' and p.tablename = g.table_name and (p.cmd = g.privilege_type or p.cmd = 'ALL') and p.roles && array['public','authenticated']::name[])")"
          if [ -n "$bad" ]; then echo "privilege authenticated tanpa policy RLS yang membolehkan:"; echo "$bad"; exit 1; fi
          test "$(q "select count(*) from pg_class where relnamespace = 'public'::regnamespace and relkind = 'r' and relrowsecurity and relname like 'prompter%'")" -ge "30"

      - name: Uji RLS lintas tenant setelah grants (harus ALL_PASS | fails=0)
        run: |
          set -uo pipefail
          out="$(psql -X -q -v ON_ERROR_STOP=1 -d postgres -f qa/qa2-rls-cross-tenant.sql 2>&1)" || true  # blok sengaja berakhir galat
          echo "$out" | grep -o 'QA2_RLS_RESULT.*' | cut -c1-300 || true
          echo "$out" | grep -q 'QA2_RLS_RESULT ALL_PASS | fails=0' || { echo "RLS bukan ALL_PASS"; exit 1; }
