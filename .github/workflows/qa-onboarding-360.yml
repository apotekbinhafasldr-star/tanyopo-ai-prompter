name: QA onboarding 360px (temp)

# QA only, cabang sementara: build lokal di runner dengan env placeholder + backend palsu lokal (scripts/qa/mock-supabase.mjs).
# Tanpa secret, tanpa Supabase/Netlify, tanpa deploy.
on:
  push:
    branches: ["tmp/verify-onboarding-e2e"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  onboarding-360:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - run: npm i --no-save playwright@1.49.1 @axe-core/playwright@4.10.1
      - run: npx playwright install --with-deps chromium
      - name: Start app
        run: |
          nohup node scripts/qa/mock-supabase.mjs > mock.log 2>&1 &
          nohup npm run start > server.log 2>&1 &
          for i in $(seq 1 40); do curl -sf http://localhost:3000/login >/dev/null && break; sleep 2; done
      - name: QA onboarding 360px
        run: node scripts/qa/onboarding-360.mjs
      - name: Emit screenshots into the log
        if: always()
        run: |
          for f in qa-output/jpg/*.jpg; do echo "SHOT_BEGIN $(basename "$f" .jpg)"; base64 -w 100 "$f"; echo "SHOT_END"; done
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-onboarding-360
          path: |
            qa-output
            server.log
            mock.log
