name: QA-2 schema bundle test (sandbox)

# Uji otomatis ATAS bundel skema QA-2 pada Postgres sementara (service container) dengan stand-in Supabase minimal
# (qa/ci/supabase-standin.sql). TANPA secret, tanpa jaringan keluar, tanpa proyek Supabase nyata.
# Bukti yang dihasilkan: SANDBOX (stand-in), bukan REAL.
on:
  pull_request:
    paths:
      - "qa/**"
      - "scripts/qa/build-schema-bundle.mjs"
      - "scripts/qa/apply-schema-bundle.mjs"
      - "supabase/migrations/**"
      - ".github/workflows/qa2-schema-bundle-test.yml"

permissions:
  contents: read

concurrency:
  group: qa2-schema-bundle-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle-on-postgres:
    name: bundle 3 bagian (PostgreSQL ${{ matrix.pg }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        pg: ["16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Pastikan psql
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      - name: Bangun bundel 3 bagian
        run: node scripts/qa/build-schema-bundle.mjs --out "$RUNNER_TEMP/bundle/qa2.sql" --parts 3

      - name: Muat stand-in Supabase dan terapkan bagian 1,2,3 berurutan
        run: |
          set -euo pipefail
          psql -X -q -v ON_ERROR_STOP=1 -d postgres -f qa/ci/supabase-standin.sql
          for i in 1 2 3; do
            psql -X -q -At -v ON_ERROR_STOP=1 -d postgres -f "$RUNNER_TEMP/bundle/qa2.part${i}of3.sql" > "$RUNNER_TEMP/out$i.txt"
          done
          echo "Baris verifikasi akhir: $(tail -n 1 "$RUNNER_TEMP/out3.txt")"
          test "$(tail -n 1 "$RUNNER_TEMP/out3.txt")" = "15|O|1|1|3|t|t|t|1"

      - name: Uji RLS lintas tenant (harus ALL_PASS | fails=0)
        run: |
          set -uo pipefail
          out="$(psql -X -q -v ON_ERROR_STOP=1 -d postgres -f qa/qa2-rls-cross-tenant.sql 2>&1)" || true  # blok sengaja berakhir galat (exit 3)
          echo "$out" | grep -o 'QA2_RLS_RESULT.*' | cut -c1-300 || true
          echo "$out" | grep -q 'QA2_RLS_RESULT ALL_PASS | fails=0' || { echo "RLS bukan ALL_PASS"; exit 1; }

      - name: Jalankan ulang bagian 1 (harus DITOLAK, proyek tidak kosong)
        run: |
          set -uo pipefail
          out="$(psql -X -q -v ON_ERROR_STOP=1 -d postgres -f "$RUNNER_TEMP/bundle/qa2.part1of3.sql" 2>&1)" && { echo "bagian 1 ulang seharusnya ditolak"; exit 1; }
          echo "$out" | grep ABORT || true
          echo "$out" | grep -q 'ABORT: schema public tidak kosong' || { echo "alasan penolakan tidak sesuai"; exit 1; }

      - name: Bagian tidak berurutan ditolak (basis data kosong baru)
        run: |
          set -uo pipefail
          createdb ooo
          psql -X -q -v ON_ERROR_STOP=1 -d ooo -f qa/ci/supabase-standin.sql
          for i in 2 3; do
            out="$(psql -X -q -v ON_ERROR_STOP=1 -d ooo -f "$RUNNER_TEMP/bundle/qa2.part${i}of3.sql" 2>&1)" && { echo "bagian $i di basis data kosong seharusnya ditolak"; exit 1; }
            echo "$out" | grep -E 'ABORT|ERROR' | head -n 2 || true
            # Pada basis data kosong tabel pelacak belum ada: PostgreSQL menolak (relation does not exist) sebelum pesan ABORT; keduanya = ditolak.
            echo "$out" | grep -Eq 'ABORT: bagian sebelumnya belum diterapkan|relation "public._linoe_sandbox_applied" does not exist' || { echo "alasan penolakan tidak sesuai"; exit 1; }
          done
          # Bagian 1 terpasang lalu bagian 3 (melewati 2): harus ditolak dengan pesan ABORT guard urutan.
          psql -X -q -v ON_ERROR_STOP=1 -d ooo -f "$RUNNER_TEMP/bundle/qa2.part1of3.sql" > /dev/null
          out="$(psql -X -q -v ON_ERROR_STOP=1 -d ooo -f "$RUNNER_TEMP/bundle/qa2.part3of3.sql" 2>&1)" && { echo "bagian 3 melewati 2 seharusnya ditolak"; exit 1; }
          echo "$out" | grep -q 'ABORT: bagian sebelumnya belum diterapkan' || { echo "alasan penolakan tidak sesuai"; exit 1; }
