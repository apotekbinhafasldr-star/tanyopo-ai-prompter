name: QA mobile 360px

# QA only: builds the app locally on the runner with placeholder env (no Supabase/Netlify call, no deploy).
on:
  pull_request:

jobs:
  mobile-360:
    runs-on: ubuntu-latest
    env:
      # CI-only: points the app at the fake backend scripts/qa/mock-supabase.mjs (runner-local). Never used in deploys.
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - run: npm i --no-save playwright@1.49.1 @axe-core/playwright@4.10.1
      - run: npx playwright install --with-deps chromium
      - name: Start app
        run: |
          nohup node scripts/qa/mock-supabase.mjs > mock.log 2>&1 &
          # Ephemeral value generated on this runner only, used so the demo entry can be exercised; never stored.
          export DEMO_SESSION_SECRET="$(openssl rand -hex 32)"
          nohup npm run start > server.log 2>&1 &
          for i in $(seq 1 40); do curl -sf http://localhost:3000/login >/dev/null && break; sleep 2; done
      - name: QA 360px
        run: node scripts/qa/mobile-360.mjs
      - name: Emit screenshots into the log (artifact download is not possible from some environments)
        if: always()
        run: |
          for f in qa-output/jpg/*.jpg; do echo "SHOT_BEGIN $(basename "$f" .jpg)"; base64 -w 100 "$f"; echo "SHOT_END"; done
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-mobile-360
          path: |
            qa-output
            server.log
            mock.log
